<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>East Beauregard Band | Daily Board</title>
<style>
:root{--red:#a51e36;--blue:#76b9e6;--navy:#152840;--bg:#edf3f8;--ink:#17293d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{cursor:pointer;font:inherit}header{background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;gap:15px;border-bottom:5px solid var(--red)}header h1{font-size:clamp(20px,2.3vw,36px);margin:0}header p{margin:4px 0 0;color:#c6e5f8}.clock{text-align:right;font-size:clamp(16px,1.5vw,25px);font-weight:bold}.clock small{display:block;font-size:.6em;font-weight:normal}.tabs{display:flex;gap:8px;padding:9px 18px;background:white}.tab{flex:1;border:2px solid #d2dfec;border-radius:9px;padding:10px;background:#f3f7fb;color:var(--navy);font-weight:bold}.tab.active{background:var(--red);border-color:var(--red);color:white}.board{height:calc(100dvh - 142px);min-height:480px;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;padding:12px}.column{display:flex;flex-direction:column;gap:12px;min-height:0}.panel{background:white;border-radius:13px;box-shadow:0 2px 8px #17314a14;display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:1}.panel h2{margin:0;background:var(--navy);color:white;font-size:clamp(16px,1.45vw,23px);padding:11px 14px;border-left:6px solid var(--blue)}.panel .inside{padding:14px;overflow:auto;flex:1;font-size:clamp(15px,1.15vw,20px)}.post{padding:10px 0;border-bottom:1px solid #e3ebf1}.post h3{font-size:1em;margin:0 0 5px}.post p{margin:0;line-height:1.35}.post small{color:#667}.reminder{background:#fff5f5;border-left:4px solid var(--red);padding:10px;margin:8px 0;border-radius:6px}.timer-number{text-align:center;font-size:clamp(44px,5.5vw,100px);font-weight:800;font-variant-numeric:tabular-nums;margin:12px 0}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.controls button{border:0;border-radius:8px;background:var(--navy);color:white;padding:10px 14px;font-weight:bold}.controls button.secondary{background:#dbe8f2;color:var(--navy)}.rhythm-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%}.rhythm-wrap svg{width:100%;max-height:240px;background:#f4f9ff;border-radius:10px}.hint{color:#5d7183;font-size:.85em;text-align:center}.goals{line-height:1.5;font-size:1.15em}.calendar-frame{width:100%;height:100%;min-height:180px;border:0}.empty{color:#667}.status{font-size:.78em;color:#536c82;padding:5px 12px}.hidden{display:none!important}@media(max-width:850px){header{padding:10px}.board{height:auto;min-height:calc(100dvh - 135px);grid-template-columns:1fr}.column{min-height:340px}.panel{min-height:200px}.tabs{padding:6px}.tab{font-size:13px;padding:8px 3px}}
</style></head><body>
<header><div><h1>🎺 East Beauregard Band</h1><p id="class-title">6th Grade Daily Board</p></div><div class="clock"><span id="time"></span><small id="date"></small></div></header>
<nav class="tabs" aria-label="Select band class"><button class="tab" data-grade="6th Grade">6th Grade</button><button class="tab" data-grade="7th Grade">7th Grade</button><button class="tab" data-grade="High School">High School</button></nav>
<div class="board">
 <div class="column"><section class="panel" style="flex:1.7"><h2>📣 Announcements</h2><div class="inside" id="announcements"></div></section><section class="panel"><h2>📌 Reminders</h2><div class="inside" id="reminders"></div></section></div>
 <div class="column"><section class="panel" style="flex:1.4"><h2 id="work-title">🎼 Rhythm Practice</h2><div class="inside" id="work"></div></section><section class="panel"><h2>⏱ Rehearsal Timer</h2><div class="inside"><div class="timer-number" id="timer">05:00</div><div class="controls"><button id="start">Start</button><button class="secondary" id="reset">Reset</button><button class="secondary" data-min="1">1 min</button><button class="secondary" data-min="5">5 min</button><button class="secondary" data-min="10">10 min</button></div></div></section></div>
 <div class="column"><section class="panel"><h2>📅 Upcoming Events</h2><div class="inside" id="events"><p class="empty">Calendar information will appear here when configured in Google Sheets.</p></div></section></div>
</div><div class="status" id="status" aria-live="polite">Loading Google Sheets…</div>
<script>
const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR7acYCTdlJ05d5ju0I6qjmxwFuUmdjZOaCBVfUpvg867bD7yJAexbfFneIy_LxGs0q7phNlbjCO8oM/pub?gid=0&single=true&output=csv';
const CLASSES=['6th Grade','7th Grade','High School'];let current=localStorage.getItem('bandTab')||CLASSES[0],grades={},rhythms={};if(!CLASSES.includes(current))current=CLASSES[0];
const $=id=>document.getElementById(id);function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function parseCSV(s){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);rows.push(row)}return rows}
function normalize(s){s=String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(s.includes('6th')||s==='6'||s==='beginner')return CLASSES[0];if(s.includes('7th')||s==='7')return CLASSES[1];if(s.includes('high')||s==='hs'||s==='8th12th')return CLASSES[2];return null}
function buildGrades(rows){const out={};CLASSES.forEach(c=>out[c]={reminder:[],announcements:[],calendar:'',bellwork:[]});rows.slice(1).forEach(r=>{const [grade,type,date,title,value]=r.concat(['','','','','']).map(x=>String(x||'').trim());const key=normalize(grade);if(!key)return;const g=out[key],t=type.toLowerCase();if(t==='calendar')g.calendar=value||title;else if(t==='reminder')g.reminder.push(value||title);else if(t==='announcement')g.announcements.push({title,date,text:value});else if(t==='bellwork')g.bellwork.push({date,text:value||title})});return out}
const VALUES={q:1,h:2,w:4,e:.5,dq:1.5,qr:1,hr:2,er:.5};const POOLS={ '6th Grade':['q','q','q','h','w','qr','hr'], '7th Grade':['q','h','e','e','dq','qr','er','hr']};
function makeMeasure(grade){let remaining=4,notes=[],attempts=0;while(remaining>0&&attempts++<50){const choices=POOLS[grade].filter(k=>VALUES[k]<=remaining+1e-8);const key=choices[Math.floor(Math.random()*choices.length)];notes.push(key);remaining=Math.round((remaining-VALUES[key])*2)/2}return notes}
function makeRhythm(grade){return [makeMeasure(grade),makeMeasure(grade)]}
function notation(grade){const measures=rhythms[grade]||(rhythms[grade]=makeRhythm(grade));let svg='<svg viewBox="0 0 820 230" role="img" aria-label="Two measures of rhythm in four four time"><g stroke="#263a4f" stroke-width="2">';for(let y of [56,78,100,122,144])svg+=`<line x1="22" y1="${y}" x2="798" y2="${y}"/>`;svg+='</g><text x="30" y="99" font-size="35" font-weight="bold">4</text><text x="30" y="137" font-size="35" font-weight="bold">4</text>';
let x=85;measures.forEach((m,mi)=>{const start=mi===0?82:442,width=mi===0?348:344;let pos=start;const step=width/m.length;for(const k of m){x=pos+step/2;pos+=step;const rest=k.endsWith('r');if(rest){svg+=`<text x="${x-13}" y="113" font-family="serif" font-size="40">${k==='hr'?'𝄼':k==='er'?'𝄾':'𝄽'}</text>`;continue}const open=k==='h'||k==='w';svg+=`<ellipse cx="${x}" cy="122" rx="12" ry="8" transform="rotate(-18 ${x} 122)" fill="${open?'white':'#17293d'}" stroke="#17293d" stroke-width="2.5"/>`;if(k!=='w'){svg+=`<line x1="${x+11}" y1="120" x2="${x+11}" y2="65" stroke="#17293d" stroke-width="3"/>`;if(k==='e')svg+=`<path d="M ${x+11} 65 Q ${x+38} 74 ${x+23} 96" fill="none" stroke="#17293d" stroke-width="3"/>`}if(k==='dq')svg+=`<circle cx="${x+23}" cy="120" r="3.3"/>`;}svg+=`<line x1="${mi===0?428:798}" y1="56" x2="${mi===0?428:798}" y2="144" stroke="#17293d" stroke-width="3"/>`});return svg+'</svg>'}
function render(){document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.grade===current);b.setAttribute('aria-pressed',b.dataset.grade===current)});$('class-title').textContent=current+' Daily Board';const g=grades[current]||{reminder:[],announcements:[],calendar:'',bellwork:[]};$('announcements').innerHTML=g.announcements.length?g.announcements.map(a=>`<article class="post"><h3>${esc(a.title)}</h3>${a.date?`<small>${esc(a.date)}</small>`:''}<p>${esc(a.text)}</p></article>`).join(''):'<p class="empty">No announcements posted.</p>';$('reminders').innerHTML=g.reminder.length?g.reminder.map(t=>`<div class="reminder">${esc(t)}</div>`).join(''):'<p class="empty">No reminders posted.</p>';
const hs=current==='High School';$('work-title').textContent=hs?'🎯 Rehearsal Goals':'🎼 Rhythm Practice';if(hs){$('work').innerHTML='<div class="goals">'+(g.bellwork.length?g.bellwork.map(a=>`<p>${esc(a.text)}</p>`).join(''):'<p>Prepare your music, warm up with purpose, and check today’s announcements.</p>')+'</div>'}else{$('work').innerHTML='<div class="rhythm-wrap">'+notation(current)+'<div class="hint">4/4 time · Every measure adds up to four beats</div><div class="controls"><button id="new-rhythm">↻ New Rhythm</button></div></div>';$('new-rhythm').onclick=()=>{rhythms[current]=makeRhythm(current);render()}};
const url=g.calendar;if(url&&/^https:\/\/calendar\.google\.com\//.test(url)){$('events').innerHTML='';const frame=document.createElement('iframe');frame.className='calendar-frame';frame.title=current+' Calendar';frame.src=url;$('events').appendChild(frame)}else{$('events').innerHTML='<p class="empty">Add a public Google Calendar embed URL to a Calendar row in your Google Sheet to show events here.</p>'}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.grade;localStorage.setItem('bandTab',current);render()}));
let timerSeconds=300,deadline=null,interval=null;function drawTimer(){const s=deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000)):timerSeconds;$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(deadline&&s===0){deadline=null;timerSeconds=0;clearInterval(interval);interval=null;$('start').textContent='Start'}}$('start').onclick=()=>{if(deadline){timerSeconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));deadline=null;clearInterval(interval);interval=null;$('start').textContent='Resume'}else if(timerSeconds>0){deadline=Date.now()+timerSeconds*1000;interval=setInterval(drawTimer,200);$('start').textContent='Pause'}drawTimer()};function setTimer(min){deadline=null;clearInterval(interval);interval=null;timerSeconds=min*60;$('start').textContent='Start';drawTimer()}$('reset').onclick=()=>setTimer(5);document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>setTimer(Number(b.dataset.min)));
function clock(){const n=new Date();$('time').textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});$('date').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}clock();setInterval(clock,10000);
async function loadData(){try{const r=await fetch(SHEET_URL+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);grades=buildGrades(parseCSV(await r.text()));$('status').textContent='Google Sheets connected · Updated '+new Date().toLocaleTimeString();render()}catch(e){$('status').textContent='Google Sheets could not load. Check the published CSV link. '+e.message;render()}}render();loadData();setInterval(loadData,300000);
</script></body></html>
